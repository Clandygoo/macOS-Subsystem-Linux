# macOS Subsystem for Linux - Debian VM Configuration
# https://github.com/Clandygoo/macOS-Subsystem-Linux

# VM Type: Apple Virtualization Framework (best for M1/M2/M3/M4)
vmType: vz

# Rosetta emulation for x86_64 binaries (optional)
rosetta:
  enabled: true

# CPU and Memory
cpus: 4
memory: "512MiB"

# Disk (will be expanded on first boot)
disk: "20GiB"

# Debian image (use official Lima template)
images:
  - location: "https://cloud.debian.org/images/cloud/bookworm/daily/latest/debian-12-genericcloud-arm64-daily.qcow2"
    arch: "aarch64"

# USB device passthrough (Qualcomm 9008 / Xiaomi / Vivo / OnePlus)
usb:
  - vendorId: "05c6"
    productId: "9008"

# Provisioning scripts
provision:
  # Install packages
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y \
        ntfs-3g \
        fuse3 \
        sshfs \
        htop \
        curl \
        wget \
        vim \
        git \
        build-essential \
        sudo \
        usbutils \
        libusb-1.0-0-dev \
        libftdi-dev \
        python3-pip \
        android-tools-adb \
        android-tools-fastboot \
        lz4 \
        zlib1g-dev \
        libxml2-dev

  # Install Qualcomm EDL tool
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      cd /tmp
      git clone https://github.com/bkerler/edl.git
      cd edl
      pip3 install -r requirements.txt
      ln -sf /tmp/edl/edl /usr/local/bin/edl
      chmod +x /tmp/edl/edl

  # Create user and configure
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      # Create msl user
      useradd -m -s /bin/bash -G sudo msl || true
      echo "msl:msl" | chpasswd
      echo "msl ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers.d/msl
      chmod 0440 /etc/sudoers.d/msl
      # Enable SSH
      systemctl enable ssh
      systemctl start ssh
      # Create directories
      mkdir -p /mnt/ntfs
      mkdir -p /mnt/host
      mkdir -p /opt/flash
      chmod 755 /mnt/ntfs /mnt/host /opt/flash

  # Install USB rules for Qualcomm EDL
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      printf '%s\n' \
        'SUBSYSTEM=="usb", ATTRS{idVendor}=="05c6", ATTRS{idProduct}=="9008", MODE="0666", GROUP="plugdev"' \
        'SUBSYSTEM=="usb", ATTRS{idVendor}=="2717", ATTRS{idProduct}=="ff40", MODE="0666", GROUP="plugdev"' \
        'SUBSYSTEM=="usb", ATTRS{idVendor}=="2d95", ATTRS{idProduct}=="ff40", MODE="0666", GROUP="plugdev"' \
        'SUBSYSTEM=="usb", ATTRS{idVendor}=="2a70", ATTRS{idProduct}=="9008", MODE="0666", GROUP="plugdev"' \
        > /etc/udev/rules.d/51-edl.rules
      udevadm control --reload-rules || true
      udevadm trigger || true

# SSH configuration
ssh:
  localPort: 60022
  forwardAgent: true

# Mount type for host directories
mountType: virtiofs

# Additional mounts
mounts:
  - location: "~"
    writable: true
  - location: "/Volumes"
    writable: true
    mountPoint: "/Volumes"

# Network configuration
networks:
  - vzNAT: true
