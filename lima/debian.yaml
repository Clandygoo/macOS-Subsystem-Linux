# macOS Subsystem for Linux - Debian VM Configuration
# https://github.com/Clandygoo/macOS-Subsystem-Linux

# VM Type: Apple Virtualization Framework (best for M1/M2/M3/M4)
vmType: vz

# Rosetta emulation for x86_64 binaries (optional)
rosetta:
  enabled: true

# CPU and Memory
cpus: 4
memory: "1GiB"

# Disk (will be expanded on first boot)
disk: "20GiB"

# Debian image (use official Lima template)
images:
  - location: "https://cloud.debian.org/images/cloud/bookworm/daily/latest/debian-12-genericcloud-arm64-daily.qcow2"
    arch: "aarch64"

# Provisioning scripts
provision:
  # Install packages
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y \
        ntfs-3g \
        fuse3 \
        sshfs \
        htop \
        curl \
        wget \
        vim \
        git \
        build-essential \
        sudo

  # Create user and configure
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      # Create msl user
      useradd -m -s /bin/bash -G sudo msl || true
      echo "msl:msl" | chpasswd
      echo "msl ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers.d/msl
      chmod 0440 /etc/sudoers.d/msl
      # Enable SSH
      systemctl enable ssh
      systemctl start ssh
      # Create directories
      mkdir -p /mnt/ntfs
      mkdir -p /mnt/host
      chmod 755 /mnt/ntfs /mnt/host

# SSH configuration
ssh:
  localPort: 60022
  forwardAgent: true

# Mount type for host directories
mountType: virtiofs

# Additional mounts (user home directory)
mounts:
  - location: "~"
    writable: true

# Network configuration
networks:
  - vzNAT: true
